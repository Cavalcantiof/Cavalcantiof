name: Laboratório automático

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia às 06:00 de Recife (09:00 UTC)
  workflow_dispatch:       # botão "Run workflow" na aba Actions

permissions:
  contents: write

jobs:
  diario:
    name: Atualizar diário do README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar o robô
        run: python scripts/atualizar_readme.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Salvar alterações
        run: |
          git config user.name "lab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "🤖 lab: atualização automática do diário"
          git push

  cobrinha:
    name: Gerar cobrinha de contribuições
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00FF66

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
